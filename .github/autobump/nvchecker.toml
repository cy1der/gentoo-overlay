# Upstream version sources for automated bumps, see .github/autobump/README.md.
#
# Each table is an nvchecker entry (https://nvchecker.readthedocs.io) keyed by
# the package atom, plus our own keys, which nvchecker ignores:
#   x_mode     "pr" (mechanical bump, falls back to Claude), "ai" (Claude
#              does the bump), or "issue" (only open an issue). Default: "issue"
#   x_drop_old drop the previous ebuild in a second commit. Default: false

# --- pr: mechanical bumps ---------------------------------------------------

["games-util/igir-bin"]
source = "github"
github = "emmercm/igir"
use_latest_release = true
prefix = "v"
x_mode = "pr"
x_drop_old = true

["net-p2p/mkbrr-bin"]
source = "github"
github = "autobrr/mkbrr"
use_latest_release = true
prefix = "v"
x_mode = "pr"
