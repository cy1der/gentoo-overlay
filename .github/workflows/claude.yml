name: Claude

# Mention @claude in an issue or PR comment to have Claude work on it. Only the
# repository owner can trigger it. Every other comment (including the bot's
# own) still starts a run, which the job's `if` skips straight away.
#
# Claude runs on the runner, next to the same gentoo container as CI and
# autobump. pkgdev, pkgcheck, ebuild, pycargoebuild, equery and
# `gentoo.sh build|deps` run in that container through .github/claude/bin. The
# overlay is /overlay on both sides, and /var/tmp/portage and the distfiles
# have the same paths too, so Claude can read what portage unpacks.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  # For Claude to read CI results (additional_permissions below)
  actions: read

env:
  STAGE3: gentoo/stage3:latest

jobs:
  claude:
    if: >-
      (github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AUTOBUMP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_KEY }}

      - name: Look up the app's bot user
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Restore only: the package isn't known up front, and saving would add
      # an entry per run to the repository's 10 GB
      - uses: actions/cache/restore@v6
        with:
          path: ~/gentoo-cache
          key: gentoo-claude-${{ github.run_id }}
          restore-keys: |
            gentoo-

      - name: Set up Gentoo container
        run: |
          mkdir -p ~/gentoo-cache/distfiles ~/gentoo-cache/binpkgs
          sudo mkdir -p /var/tmp/portage
          # The same paths as in the container, for Claude's own tools
          sudo ln -sfn "$GITHUB_WORKSPACE" /overlay
          sudo ln -sfn ~/gentoo-cache/distfiles /var/cache/distfiles
          # ::gentoo from the daily gentoo/portage image (no keyserver needed)
          docker create -v /var/db/repos/gentoo --name portage-tree gentoo/portage:latest /bin/true
          docker run -d --name gentoo --volumes-from portage-tree -v "$PWD:/overlay" -w /overlay \
            -v ~/gentoo-cache/distfiles:/var/cache/distfiles \
            -v ~/gentoo-cache/binpkgs:/var/cache/binpkgs \
            -v /var/tmp/portage:/var/tmp/portage \
            "$STAGE3" sleep infinity
          docker exec gentoo /overlay/.github/autobump/gentoo.sh setup
          # setup makes the distfiles portage's
          docker exec gentoo chmod -R a+rX /var/cache/distfiles
          echo "$GITHUB_WORKSPACE/.github/claude/bin" >> "$GITHUB_PATH"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.app.outputs.app-slug }}[bot]
          use_commit_signing: true
          branch_prefix: claude/
          additional_permissions: |
            actions: read
          # A build may take an hour in the foreground, see claude_round in
          # .github/autobump/gentoo.sh
          settings: |
            {"env": {"BASH_DEFAULT_TIMEOUT_MS": "3600000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          claude_args: |
            --add-dir /var/tmp/portage --add-dir /var/cache/distfiles
            --allowedTools "WebFetch,Bash(pkgdev:*),Bash(pkgcheck:*),Bash(ebuild:*),Bash(pycargoebuild:*),Bash(equery:*),Bash(gentoo.sh build:*),Bash(gentoo.sh deps:*),Bash(python3:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(diff:*),Bash(tar:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(cat:*),Bash(head:*),Bash(tail:*)"
            --append-system-prompt "This job runs on a GitHub runner next to a gentoo/stage3 container with ::gentoo and this overlay (cy1der) set up. pkgdev, pkgcheck, ebuild, pycargoebuild, equery and gentoo.sh run in that container; call them by name, they are on PATH. /overlay is this checkout on both sides, and portage unpacks to /var/tmp/portage, which you can read. Whenever you add or change an ebuild, verify it before you commit: regenerate the Manifest with pkgdev manifest in the package directory, run pkgcheck scan --exit error,warning,style -- cat/pn, and build it with gentoo.sh build '=cat/pn-ver' (quote the atom). That installs only the build-time dependencies, then the package, the same way CI does; never build with a plain emerge. Run builds in the foreground with a long Bash timeout and never two at once. Follow .github/autobump/prompt.md for ebuild changes (patches, CRATES, verify-sig, no weakening the package). In your reply, say what you verified and what you could not."
