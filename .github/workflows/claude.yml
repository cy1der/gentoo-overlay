name: Claude

# Mention @claude in an issue or PR comment to have Claude work on it. Only the
# repository owner can trigger it. This runs on plain Ubuntu without portage,
# so builds are checked by the CI workflow on the PR afterwards.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      (github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AUTOBUMP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_KEY }}

      - name: Look up the app's bot user
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.app.outputs.app-slug }}[bot]
          use_commit_signing: true
          branch_prefix: claude/
